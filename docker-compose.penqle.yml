# Tortoise WoW (Penqle core + TortoiseBots) — Compose stack.
# Copy .env.example.penqle to .env and set secrets before starting.
#
# Supersedes the Shyalya-based stack; see docs/SPEC.md.

x-turtle-image: &turtle-image ${TURTLE_IMAGE:-tortoise-docker:penqle-bots}

services:
  db:
    image: mariadb:11.8@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb.cnf:/etc/mysql/conf.d/turtle.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-init:
    image: *turtle-image
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      DB_USER: ${DB_USER:-mangos}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_LOGIN: ${DB_LOGIN:-tw_logon}
      DB_WORLD: ${DB_WORLD:-tw_world}
      DB_CHAR: ${DB_CHAR:-tw_char}
      DB_LOGS: ${DB_LOGS:-tw_logs}
      REALM_NAME: ${REALM_NAME:-TurtleWoW}
      REALM_ADDRESS: ${REALM_ADDRESS:-127.0.0.1}
      WORLD_PORT: ${WORLD_PORT:-8090}
      REALM_ID: ${REALM_ID:-1}
    volumes:
      - init-marker:/var/lib/turtle-init
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint.sh"]
    command: ["db-init"]
    restart: "no"

  realmd:
    image: *turtle-image
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-mangos}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_LOGIN: ${DB_LOGIN:-tw_logon}
      REALM_PORT: ${REALM_PORT:-3724}
      BIND_IP: "0.0.0.0"
    ports:
      - "${GAME_BIND_IP:-127.0.0.1}:${REALM_PORT:-3724}:3724"
    volumes:
      - ${CONFIG_PATH:-./config}:/opt/turtle/etc
    command: ["realmd"]

  mangosd:
    image: *turtle-image
    depends_on:
      db-init:
        condition: service_completed_successfully
      realmd:
        condition: service_started
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-mangos}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_LOGIN: ${DB_LOGIN:-tw_logon}
      DB_WORLD: ${DB_WORLD:-tw_world}
      DB_CHAR: ${DB_CHAR:-tw_char}
      DB_LOGS: ${DB_LOGS:-tw_logs}
      DATA_DIR: /opt/turtle/data
      WORLD_PORT: ${WORLD_PORT:-8090}
      REALM_ID: ${REALM_ID:-1}
      BIND_IP: "0.0.0.0"
      LOG_SQL: ${LOG_SQL:-0}
      DATABASE_AUTOUPDATE_ENABLED: ${DATABASE_AUTOUPDATE_ENABLED:-1}
      AI_PLAYERBOT_ENABLED: ${AI_PLAYERBOT_ENABLED:-1}
      AI_MIN_RANDOM_BOTS: ${AI_MIN_RANDOM_BOTS:-10}
      AI_MAX_RANDOM_BOTS: ${AI_MAX_RANDOM_BOTS:-10}
      AI_DISABLE_RANDOM_LEVELS: ${AI_DISABLE_RANDOM_LEVELS:-0}
      AI_RANDOM_BOT_STARTING_LEVEL: ${AI_RANDOM_BOT_STARTING_LEVEL:-1}
      AI_RANDOM_BOT_MAX_LEVEL: ${AI_RANDOM_BOT_MAX_LEVEL:-60}
      AI_RANDOM_BOT_AUTOLOGIN: ${AI_RANDOM_BOT_AUTOLOGIN:-0}
      AI_ENABLE_RANDOM_TELEPORTS: ${AI_ENABLE_RANDOM_TELEPORTS:-0}
      AI_RANDOM_BOT_LFT_ENABLED: ${AI_RANDOM_BOT_LFT_ENABLED:-0}
      AI_AH_MARKET_ENABLED: ${AI_AH_MARKET_ENABLED:-0}
    ports:
      - "${GAME_BIND_IP:-127.0.0.1}:${WORLD_PORT:-8090}:8090"
    volumes:
      - ${DATA_PATH:-./data}:/opt/turtle/data:ro
      - ${CONFIG_PATH:-./config}:/opt/turtle/etc
      - mangosd-logs:/opt/turtle/logs
    command: ["mangosd"]
    stop_grace_period: 2m

volumes:
  db-data:
  init-marker:
  mangosd-logs:
