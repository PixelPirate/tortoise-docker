name: Publish to GHCR

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".env.example*"
  workflow_dispatch:
    inputs:
      core_commit:
        description: "Commit SHA of tortoise-wow (1181dev) to build"
        required: false
        default: "010cdb6d513ae3c29ab685e2ff708fb18d8295c8"
      bots_commit:
        description: "Commit SHA of Sagiroth/TortoiseBots to build"
        required: false
        default: "76a0a13d9bfce850e51f2e5df085019521caf386"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: penqle-bots
            dockerfile: Dockerfile.penqle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve source commits
        id: source
        run: |
          CORE_SHA="${{ github.event.inputs.core_commit || '010cdb6d513ae3c29ab685e2ff708fb18d8295c8' }}"
          BOTS_SHA="${{ github.event.inputs.bots_commit || '76a0a13d9bfce850e51f2e5df085019521caf386' }}"
          echo "Core pin: ${CORE_SHA}"
          echo "Bots pin: ${BOTS_SHA}"
          echo "core_sha=${CORE_SHA}" >> "$GITHUB_OUTPUT"
          echo "bots_sha=${BOTS_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,prefix=${{ matrix.tag }}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CORE_COMMIT=${{ steps.source.outputs.core_sha }}
            BOTS_COMMIT=${{ steps.source.outputs.bots_sha }}
            CPU_TARGET=x86-64-v2
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          provenance: false
